<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>og-v3 — render at exactly 1200x630, screenshot to og-v3.png</title>
<style>
@font-face{font-family:'Instrument Serif';font-style:normal;font-weight:400;
  src:url('./fonts/instrument-serif-latin.woff2') format('woff2')}
@font-face{font-family:'Instrument Serif';font-style:italic;font-weight:400;
  src:url('./fonts/instrument-serif-italic-latin.woff2') format('woff2')}
@font-face{font-family:'Inter';font-style:normal;font-weight:400 900;
  src:url('./fonts/inter-latin-var.woff2') format('woff2')}
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#0f0c09;color:#f4ecdd;overflow:hidden;
  font-family:'Inter',Arial,sans-serif;position:relative}
.card{padding:72px 80px;height:100%;display:flex;flex-direction:column;justify-content:space-between}
.eyebrow{font-family:ui-monospace,Consolas,monospace;font-size:20px;letter-spacing:.08em;
  text-transform:uppercase;color:#b5a993;display:flex;align-items:center;gap:14px}
.eyebrow::before{content:'';width:30px;height:3px;background:rgba(244,236,221,.16);border-radius:2px}
h1{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:128px;line-height:.94;letter-spacing:-0.015em}
h1 em{font-style:italic;color:#ee7524}
.foot{display:flex;justify-content:space-between;align-items:baseline;
  border-top:1px solid rgba(244,236,221,.16);padding-top:28px}
.name{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-size:34px}
.stat{font-family:ui-monospace,Consolas,monospace;font-size:22px;color:#c9bda9}
.stat b{color:#ee7524;font-weight:400;font-size:30px}
</style>
</head>
<body>
<div class="card">
  <p class="eyebrow">Paid media · AI creative systems · Remote, U.S.</p>
  <h1>The work,<br><em>at full size.</em></h1>
  <div class="foot">
    <p class="name">Alex Amaro</p>
    <p class="stat"><b>9.5&times;</b> an incumbent agency&rsquo;s leads &mdash; same account</p>
  </div>
</div>
</body>
</html>
