# Public, deterministic content checks stay separate from live-publication checks.
# Private names/patterns stay in the private vault; no private configuration here.
name: guards
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: leak tripwire + claims.json integrity
        run: node tools/public-selftest.mjs
      - name: link integrity (internal targets and fragments)
        run: node tools/link-check.mjs
      - name: home claims licensed by the public contract
        run: node tools/check-home-claims.mjs
      - name: creative review counts match the dated ledger
        run: node tools/gate-ledger.mjs
  live-publication:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: guards
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: portfolio-live-publication
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Confirm GitHub Pages serves the committed HTML and stylesheet
        run: node tools/check-live-site.mjs
