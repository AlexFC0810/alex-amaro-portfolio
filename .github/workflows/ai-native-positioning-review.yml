name: AI-native positioning review
on:
  push:
    branches: [portfolio/ai-native-positioning-2026-09-04]
permissions:
  contents: write
concurrency:
  group: ai-native-positioning-review
  cancel-in-progress: false
jobs:
  review:
    if: "contains(github.event.head_commit.message, '[positioning-build]')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply bounded source-copy changes
        run: |
          cp index.html __positioning-before.html
          python3 - <<'PY'
          import pathlib, json
          def replace(text, old, new, count=1):
              found=text.count(old)
              assert found==count, f'Expected {count} matches, got {found}: {old[:90]}'
              return text.replace(old,new)
          p=pathlib.Path('tools/build-creative-portfolio.mjs')
          s=p.read_text()
          edits=[
            ('AI-native growth marketer · Meta paid social','AI-native performance marketing · Meta lead generation',1),
            ('I’m Alex Amaro. I specialize in Meta paid social. I build the offer, the creative tests, the campaigns and the follow-up systems that help turn interest into booked appointments.','I’m an AI-native performance marketer with an operator’s brain. I specialize in Meta lead generation for high-ticket service businesses—connecting buyer psychology, social-native creative and the systems behind the follow-up.',1),
            ('Call the AI demo ${arrow}</a></div><p class="experience-line"','Try the voice AI ${arrow}</a></div><p class="experience-line"',1),
            ('6+ years in online business · Digital marketing since 2022','Online business since 2018 · Client marketing since 2022',2),
            ('6+ years online business; digital marketing since 2022','Online business since 2018; client marketing since 2022',1),
            ('Career Capital CANDIDATE_PROFILE.md work history and Alex’s explicit portfolio instruction on 2026-09-04','Career Capital CANDIDATE_PROFILE.md and PORTFOLIO_NARRATIVE_AND_VIEWS_2026-09-04.md; owner-confirmed 2018 / 2020 / 2022 chronology',1),
            ('Does not assert six years of marketing experience, a corporate revenue-operations title, or measured client revenue.','Online business began in 2018; Shopify and marketing learning in 2020; client-services direction in 2022. No engineering qualification or client-revenue claim is implied.',1),
            ('I think through the whole path.<br>Then I build it.','Creative instincts.<br>Systems thinking.<br>AI throughout.',1),
            ('A campaign is not a collection of disconnected tasks. The offer, creative, media, follow-up and measurement need to work together.','AI runs through how I research, develop creative, plan tests and build workflows. I connect those pieces around one commercial question: what moves the right prospect to the next step?',1),
            ('Understand the buyer, the business and what makes the next step worth taking.','Use AI-assisted research to map buyer needs and objections. Apply commercial judgment to shape the offer.',1),
            ('Develop the angles, build the creative, structure the campaign and read the signal.','Develop and pressure-test angles with AI, then build social-native creative and a campaign worth testing.',1),
            ('Build the lead response, routing, CRM and follow-up around the customer journey.','Connect lead response, routing and CRM workflows so the next step is designed—not left to chance.',1),
            ('Look beyond cost per lead to booking, attendance, close-rate assumptions and unit economics.','Use models and AI-assisted analysis to examine lead quality, booking and downstream economics—not just cost per lead.',1),
            ('Online business taught me<br>to look beyond the click.','I learned marketing<br>by building businesses.',1),
            ('I have 6+ years of experience in online business, with digital marketing as my focus since 2022. That background shapes how I work: start with the business, understand the customer, and connect the execution.','I started selling shoes on eBay in 2018, moved into Amazon FBA and FBM, and began exploring Shopify in 2020. That is where I started learning paid advertising, websites and conversion optimization.',1),
            ('I use AI to move faster through research, creative development and implementation—not to separate the work from the judgment behind it.','In 2022, I moved into client acquisition work. My responsibilities grew beyond campaigns into creative, lead response and delivery systems. Today, AI runs through how I connect and build that work.',1),
            ('AI-Native Growth Marketer','AI-Native Performance Marketer',1),
            ("jobTitle:'AI-native growth marketer'","jobTitle:'AI-native performance marketer'",1),
            ('AI-native growth marketing · Remote, United States','AI-native performance marketing · Remote, United States',1),
            ('I specialize in Meta paid social. Explore my ad creative, campaign results, and AI voice + CRM workflows—from the first impression to the follow-up.','AI-native performance marketing for high-ticket service businesses. Explore Meta lead-generation work, creative strategy and AI-assisted marketing systems.',1),
            ('Meta paid social. Clear creative. Connected follow-up. Explore the work and try the AI voice demo.','AI-native performance marketing. Creative instincts. Systems thinking. Explore the work and try the voice AI.',1)
          ]
          for old,new,n in edits:s=replace(s,old,new,n)
          p.write_text(s)
          p=pathlib.Path('tools/check-creative-portfolio.mjs');s=p.read_text()
          s=replace(s,'I specialize in Meta paid social.','I specialize in Meta lead generation for high-ticket service businesses')
          s=replace(s,'6+ years in online business · Digital marketing since 2022','Online business since 2018 · Client marketing since 2022')
          marker="assert.ok(home.includes('id=\"voice\"'),'Demo anchor missing');"
          s=replace(s,marker,"assert.ok(home.includes('AI-native performance marketer with an operator’s brain'),'AI-native operator framing missing');\nassert.ok(home.includes('AI throughout.'),'AI-across-work framing missing');\n"+marker)
          p.write_text(s)
          p=pathlib.Path('AGENTS.md');s=p.read_text()
          s=replace(s,'**AI-native growth marketer; I specialize in Meta paid social.**','**AI-native performance marketer with an operator’s brain; Meta lead generation for high-ticket service businesses.**')
          s=replace(s,'**6+ years in online business · Digital marketing since 2022.**','**Online business since 2018 · Client marketing since 2022.**')
          s=replace(s,'- Current public expression:', '- Current narrative authority: Career Capital `PORTFOLIO_NARRATIVE_AND_VIEWS_2026-09-04.md`, synthesis commit `3a213ae5e546d279521a81639b4939a10fdde805`. AI is integral to research, creative, testing and implementation—not only the voice demo. Four qualitative copy simulations informed the wording; no conversion test was performed.\n- Current public expression:')
          p.write_text(s)
          record={
            'date':'2026-09-04',
            'authority':'Career Capital PORTFOLIO_NARRATIVE_AND_VIEWS_2026-09-04.md',
            'authority_commit':'3a213ae5e546d279521a81639b4939a10fdde805',
            'selected_intro':'I’m an AI-native performance marketer with an operator’s brain.',
            'supporting_expression':'Creative instincts. Systems thinking. AI throughout.',
            'method':'Qualitative hypothetical-reader copy comparisons; not interviews, measured conversion data or an A/B test.',
            'scope':'Copy, metadata, biography and matching source guards. Existing design, creative assets, phone number, performance claims and resume preserved.',
            'deferred':'Original-Canva curation and replacement selections; prior request to withdraw refrigeration imagery; new AI case verification and audience-specific views.',
            'phone_call_placed':False,'crm_changed':False
          }
          pathlib.Path('proof/positioning-copy-2026-09-04.json').write_text(json.dumps(record,ensure_ascii=False,indent=2)+'\n')
          PY
          node tools/build-creative-portfolio.mjs
          git diff --exit-code -- assets/portfolio.css assets/portfolio-base.css assets/portfolio.js assets/og-creative-first.html tools/portfolio-gallery.json claims.json llms.txt Alex-Amaro-Resume.pdf work.html work tools/case-studies.json
      - name: Public content and source gates
        run: |
          node tools/public-selftest.mjs
          node tools/check-home-claims.mjs
          node tools/gate-ledger.mjs
          node tools/check-creative-portfolio.mjs
          node tools/link-check.mjs
          node tools/build-creative-portfolio.mjs
      - name: Browser dependencies outside the repository
        run: |
          npm install --prefix /tmp/positioning-review playwright@1.55.1
          /tmp/positioning-review/node_modules/.bin/playwright install --with-deps chromium
      - name: Compare old and new pages, test interactions, and capture real screenshots
        run: |
          mkdir -p /tmp/positioning-evidence
          cat > /tmp/positioning-review.cjs <<'JS'
          const fs=require('node:fs'),http=require('node:http'),path=require('node:path'),assert=require('node:assert/strict');
          const {chromium}=require('/tmp/positioning-review/node_modules/playwright');
          const root=process.cwd(),out='/tmp/positioning-evidence';
          const types={'.html':'text/html','.css':'text/css','.js':'text/javascript','.json':'application/json','.woff2':'font/woff2','.webp':'image/webp','.png':'image/png','.jpg':'image/jpeg','.pdf':'application/pdf'};
          const server=http.createServer((req,res)=>{try{let u=decodeURIComponent(new URL(req.url,'http://localhost').pathname);let f=path.resolve(root,'.'+u);if(f!==root&&!f.startsWith(root+path.sep)){res.writeHead(403);return res.end();}if(fs.existsSync(f)&&fs.statSync(f).isDirectory())f=path.join(f,'index.html');if(!fs.existsSync(f)){res.writeHead(404);return res.end();}res.setHeader('Content-Type',types[path.extname(f)]||'application/octet-stream');fs.createReadStream(f).pipe(res);}catch(e){res.writeHead(500);res.end();}});
          const report={date:'2026-09-04',base_commit:'95a4994caf426796b34a7cbb29ea69e516fb2a29',checks:[],phoneCallPlaced:false,crmChanged:false,manualVisualReview:'Pending actual screenshot inspection; this is the automated receipt.',privateClaimsSweep:'Not rerun: private configuration is not copied into public CI. Existing cases, performance blocks, contract and resume are preserved.'};
          (async()=>{
            await new Promise(r=>server.listen(8791,'127.0.0.1',r));const browser=await chromium.launch({headless:true});
            try{
              for(const [w,h] of [[375,812],[760,900],[1440,900]]){
                const context=await browser.newContext({viewport:{width:w,height:h},reducedMotion:'reduce'});const page=await context.newPage();const bad=[],external=[],errors=[];
                page.on('response',r=>{if(r.status()>=400)bad.push(r.url());});page.on('pageerror',e=>errors.push(e.message));page.on('request',r=>{if(/^https?:/.test(r.url())&&!r.url().startsWith('http://127.0.0.1:8791/'))external.push(r.url());});
                await page.goto('http://127.0.0.1:8791/__positioning-before.html',{waitUntil:'networkidle'});await page.evaluate(()=>document.fonts.ready);
                const original=await page.locator('[data-claim]').evaluateAll(es=>es.map(x=>x.outerHTML));
                if(w!==760)await page.screenshot({path:path.join(out,'before-hero-'+w+'.png')});
                await page.goto('http://127.0.0.1:8791/',{waitUntil:'networkidle'});await page.evaluate(()=>document.fonts.ready);
                assert.deepEqual(await page.locator('[data-claim]').evaluateAll(es=>es.map(x=>x.outerHTML)),original,'Performance blocks changed');
                assert.equal(await page.locator('h1').count(),1);
                assert.equal(await page.locator('h1').innerText(),'Ads people understand before they can ignore them.');
                assert.ok((await page.locator('.hero-deck').innerText()).startsWith('I’m an AI-native performance marketer with an operator’s brain.'));
                assert.equal(await page.locator('.experience-line').innerText(),'Online business since 2018 · Client marketing since 2022');
                assert.equal(await page.locator('video,iframe').count(),0);
                const tel=await page.locator('a[href^="tel:"]').evaluateAll(es=>es.map(x=>x.getAttribute('href')));assert.ok(tel.length>=3&&tel.every(x=>x==='tel:+18888147785'));
                await page.addScriptTag({content:fs.readFileSync('_audit/measure.js','utf8')});const measured=await page.evaluate(()=>window.__auditMeasure());
                assert.equal(measured.tap.under44,0,JSON.stringify(measured.tap));assert.equal(measured.text.below45,0,JSON.stringify(measured.text));
                assert.ok(await page.evaluate(()=>document.documentElement.scrollWidth<=document.documentElement.clientWidth),'Horizontal overflow');
                if(w!==760){await page.screenshot({path:path.join(out,'after-hero-'+w+'.png')});await page.locator('#running').screenshot({path:path.join(out,'process-'+w+'.png')});await page.locator('#fit').screenshot({path:path.join(out,'about-'+w+'.png')});}
                await page.locator('.library-card').first().click();assert.ok(await page.locator('#creative-dialog').evaluate(e=>e.open));await page.locator('[data-image-direction="1"]').click();await page.keyboard.press('Escape');assert.ok(!await page.locator('#creative-dialog').evaluate(e=>e.open));
                await page.locator('[data-filter="health"]').click();assert.ok(await page.locator('.library-card:visible').count()>0);await page.locator('[data-filter="all"]').click();
                if(w===375){await page.locator('.menu-toggle').click();await page.locator('#nav-links a[href="#voice"]').click();assert.equal(await page.locator('.menu-toggle').getAttribute('aria-expanded'),'false');}
                await page.goto('http://127.0.0.1:8791/#voice',{waitUntil:'networkidle'});assert.ok(await page.locator('.voice-call').isVisible());
                assert.deepEqual(bad,[]);assert.deepEqual(external,[]);assert.deepEqual(errors,[]);
                report.checks.push({viewport:[w,h],performanceBlocksPreserved:original.length,contrastFailures:0,undersizedTargets:0,horizontalOverflow:false,failedResources:0,offOriginRequests:0,browserErrors:0,galleryAndNavigation:true,phoneLinks:tel.length});await context.close();
              }
              const context=await browser.newContext({viewport:{width:375,height:812},javaScriptEnabled:false});const page=await context.newPage();await page.goto('http://127.0.0.1:8791/',{waitUntil:'networkidle'});assert.ok(await page.locator('#voice').isVisible());assert.ok(await page.locator('.hero-deck').isVisible());report.noJavaScript={heroVisible:true,demoVisible:true};await context.close();
              report.passed=true;fs.mkdirSync('_audit/releases',{recursive:true});fs.writeFileSync('_audit/releases/2026-09-04-ai-native-positioning.json',JSON.stringify(report,null,2)+'\n');fs.writeFileSync(path.join(out,'report.json'),JSON.stringify(report,null,2));console.log(JSON.stringify(report,null,2));
            }finally{await browser.close();server.close();}
          })().catch(e=>{console.error(e.stack);server.close();process.exit(1)});
          JS
          node /tmp/positioning-review.cjs
      - name: Save screenshots for direct visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-native-positioning-visual-review
          path: /tmp/positioning-evidence/
          if-no-files-found: error
      - name: Commit tested copy to the review branch only
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/portfolio/ai-native-positioning-2026-09-04 | cut -f1)" = "$GITHUB_SHA"
          rm -f __positioning-before.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/build-creative-portfolio.mjs tools/check-creative-portfolio.mjs index.html creative.html proof/experience.json proof/positioning-copy-2026-09-04.json AGENTS.md _audit/releases/2026-09-04-ai-native-positioning.json
          git commit -m 'Apply AI-native positioning and corrected biography; browser-checked copy only'
          git push origin HEAD:refs/heads/portfolio/ai-native-positioning-2026-09-04
