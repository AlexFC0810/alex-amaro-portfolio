name: approved artwork import
on:
  push:
    branches: [portfolio/control-challenger-2026-09-04]
permissions:
  contents: write
jobs:
  import:
    if: contains(github.event.head_commit.message, '[asset-import]')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Import the reviewed public-only bundle with strict file and hash checks
        env:
          ARTWORK_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-e784-81f5-86ad-480ccdc816d8/raw?se=2026-09-05T04%3A08%3A36Z&sp=r&sv=2026-02-06&sr=b&scid=7fadd06d-370e-5146-9aa9-9c6a6914dc93&skoid=d1cabc79-3240-4866-94fe-6005330cb49e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-04T23%3A17%3A00Z&ske=2026-09-05T23%3A17%3A00Z&sks=b&skv=2026-02-06&sig=KpqbWiPUWU7MaYknbh4e%2BOaoAIJ9ywMM3MZHHHht/Bs%3D'
        run: |
          python3 - <<'PY'
          import os,urllib.request,hashlib,zipfile,io,json,pathlib
          with urllib.request.urlopen(os.environ['ARTWORK_URL'],timeout=30) as r:data=r.read()
          assert hashlib.sha256(data).hexdigest()=='9b2c5eb8533d568b325d7ed4e91c2cb270e950eec18f05b52cba36d5da8e0c38'
          z=zipfile.ZipFile(io.BytesIO(data))
          names={'laser-bilingual-01.avif','laser-bilingual-04.avif','tattoo-01.avif',*[f'weight-loss-{i:02d}.avif' for i in range(1,6)]}
          assert set(z.namelist())==names|{'integrity.json'}
          records=json.loads(z.read('integrity.json'))
          assert {x['file'] for x in records}==names
          out=pathlib.Path('assets/portfolio-static');out.mkdir(exist_ok=True)
          for x in records:
            body=z.read(x['file']);assert hashlib.sha256(body).hexdigest()==x['sha256'];assert x['width']==447 and x['height']==447
            (out/x['file']).write_bytes(body)
          pathlib.Path('proof/control-artwork-integrity.json').write_text(json.dumps(records,indent=2)+'\n')
          print('Imported eight approved, anonymized public artwork files. No private source data imported.')
          PY
      - name: Commit images to review branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/portfolio-static proof/control-artwork-integrity.json
          git commit -m 'Add reviewed public creative previews; no production promotion'
          git push
