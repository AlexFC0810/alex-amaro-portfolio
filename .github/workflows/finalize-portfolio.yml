name: final portfolio release preparation
on:
  push:
    branches: [portfolio/final-2026-09-04]
permissions:
  contents: write
concurrency:
  group: final-portfolio-2026-09-04
  cancel-in-progress: false
jobs:
  prepare:
    if: "!contains(github.event.head_commit.message, '[portfolio-materialized]')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize exact reviewed V4 into canonical root
        run: node tools/finalize-portfolio.mjs
      - name: Public privacy, contract and unchanged-case gates
        run: |
          node tools/public-selftest.mjs
          node tools/check-home-claims.mjs
          node tools/gate-ledger.mjs
          git diff --exit-code -- tools/case-studies.json work.html work claims.json llms.txt
          echo 'Case source, rendered cases, and compiled contract are unchanged. Private case-builder/claims-lint configuration is not present in public CI and is not copied here.'
          git add index.html assets/portfolio.css AGENTS.md DESIGN.md .github/workflows/guards.yml
          node tools/link-check.mjs
      - name: Browser test dependencies outside the repository
        run: |
          npm install --prefix /tmp/portfolio-qa playwright@1.55.1
          /tmp/portfolio-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Mobile, desktop, no-JS and interaction checks
        run: node tools/final-portfolio-qa.cjs
      - name: Preserve review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-portfolio-verification
          path: /tmp/portfolio-release-evidence/
          if-no-files-found: warn
      - name: Commit tested result to this review branch only
        env:
          RELEASE_BRANCH: portfolio/final-2026-09-04
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$RELEASE_BRANCH"
          test "$(git ls-remote origin "refs/heads/$RELEASE_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p _audit/releases
          cp /tmp/portfolio-release-evidence/report.json _audit/releases/2026-09-04-final.json
          git rm .github/workflows/finalize-portfolio.yml tools/finalize-portfolio.mjs tools/final-portfolio-qa.cjs
          git add index.html assets/portfolio.css AGENTS.md DESIGN.md .github/workflows/guards.yml _audit/releases/2026-09-04-final.json
          git commit -m 'Publish V4-derived final portfolio with callable CRM workflow demo [portfolio-materialized]'
          git push origin "HEAD:refs/heads/$RELEASE_BRANCH"
