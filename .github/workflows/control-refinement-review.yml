name: control-preserving refinement review
on:
  push:
    branches: [portfolio/control-challenger-2026-09-04]
permissions:
  contents: write
concurrency:
  group: portfolio-control-refinement
  cancel-in-progress: false
jobs:
  review:
    if: contains(github.event.head_commit.message, '[control-build]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply and render the bounded source refinement
        run: |
          python3 tools/apply-control-refinement.py
          node tools/build-creative-portfolio.mjs
          git add AGENTS.md DESIGN.md index.html creative.html ai-growth.html marketing-management.html assets/portfolio.css assets/portfolio.js proof/experience.json tools/build-creative-portfolio.mjs tools/check-creative-portfolio.mjs tools/portfolio-ai-work.mjs tools/portfolio-gallery.json
      - name: Public content and preservation gates
        run: |
          node tools/public-selftest.mjs
          node tools/check-home-claims.mjs index.html creative.html ai-growth.html marketing-management.html
          node tools/check-creative-portfolio.mjs
          node tools/gate-ledger.mjs
          node tools/link-check.mjs
          git diff --exit-code 20435edca5bf7b201b5994ab4d6043814c597dfb -- claims.json llms.txt Alex-Amaro-Resume.pdf work.html work tools/case-studies.json model.html
      - name: Browser dependencies outside the repository
        run: |
          npm install --prefix /tmp/control-qa playwright@1.55.1
          /tmp/control-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser checks and actual screenshots
        run: node tools/control-review.cjs
      - name: Preserve review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-refinement-visual-review
          path: /tmp/control-review/
          if-no-files-found: warn
      - name: Commit verified source and render to this branch only
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/portfolio/control-challenger-2026-09-04 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm tools/apply-control-refinement.py tools/control-review.cjs
          git add _audit/releases/2026-09-04-control-refinement.json
          git commit -m 'Render verified control refinement and shared audience views'
          git push origin HEAD:refs/heads/portfolio/control-challenger-2026-09-04
