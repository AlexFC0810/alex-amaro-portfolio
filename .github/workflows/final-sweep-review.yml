name: final portfolio clean capture
on:
  push:
    branches: [portfolio/final-sweep-2026-09-05]
permissions:
  contents: read
jobs:
  capture:
    if: contains(github.event.head_commit.message, '[sweep-capture]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -m pip install playwright==1.55.0
          python3 -m playwright install --with-deps chromium
      - name: Capture unmodified page content; place sticky navigation in normal flow for isolated section images
        run: |
          python3 -m http.server 8791 >/tmp/server.log 2>&1 &
          mkdir -p /tmp/clean-review
          python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          out=Path('/tmp/clean-review')
          with sync_playwright() as pw:
            b=pw.chromium.launch()
            for w,h in [(375,812),(1440,900)]:
              p=b.new_page(viewport={'width':w,'height':h},reduced_motion='reduce')
              p.goto('http://localhost:8791/index.html',wait_until='networkidle');p.evaluate('document.fonts.ready')
              p.screenshot(path=str(out/f'home-{w}.png'))
              p.add_style_tag(content='.site-nav{position:relative!important}')
              for name,selector in [('credentials','#certifications'),('conversion','#voice'),('management','#fit'),('closing','#contact'),('tattoo','.case-spotlight')]:
                p.evaluate('document.activeElement?.blur()');p.locator(selector).screenshot(path=str(out/f'{name}-{w}.png'))
              for s in p.locator('.credential-group summary').all():s.click()
              p.evaluate('document.activeElement?.blur()');p.locator('#certifications').screenshot(path=str(out/f'credentials-expanded-{w}.png'))
              p.close()
            b.close()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: final-sweep-clean-capture
          path: /tmp/clean-review/
