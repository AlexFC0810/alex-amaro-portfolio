name: creative reference review
on:
  push:
    branches: [portfolio/creative-first-2026-09-04]
permissions:
  contents: write
jobs:
  inspect:
    if: "contains(github.event.head_commit.message, 'Capture the owner-selected')"
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix /tmp/review sharp@0.34.3
      - name: Resolve stylesheet and compact captures
        run: |
          cat > /tmp/inspect.cjs <<'JS'
          const fs=require('fs'),sharp=require('/tmp/review/node_modules/sharp');
          (async()=>{
            const report=JSON.parse(fs.readFileSync('_review/reference-report.json'));
            let css=report.styles.join('\n');
            for(const u of report.links){const r=await fetch(u);if(!r.ok())throw Error('Reference CSS failed');css+='\n'+await r.text();}
            fs.writeFileSync('_review/reference.css',css.replace(/}/g,'}\n'));
            const desktop=await sharp('_review/reference-desktop.jpg').resize({width:720}).jpeg({quality:35}).toBuffer();
            const mobile=await sharp('_review/reference-mobile.jpg').resize({width:260}).jpeg({quality:35}).toBuffer();
            fs.writeFileSync('_review/desktop-small.b64',desktop.toString('base64'));
            fs.writeFileSync('_review/mobile-small.b64',mobile.toString('base64'));
            function walk(p){return fs.readdirSync(p,{withFileTypes:true}).flatMap(e=>e.isDirectory()?walk(p+'/'+e.name):[p+'/'+e.name]);}
            fs.writeFileSync('_review/all-assets.json',JSON.stringify(walk('assets').filter(p=>/\.(jpg|png|webp)$/.test(p)&&!/-\d+\./.test(p)),null,2));
            console.log(JSON.stringify({cssBytes:css.length,desktopBytes:desktop.length,mobileBytes:mobile.length}));
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/inspect.cjs
      - name: Save review-only captures on this branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _review
          git commit -m 'Reference style and compact captures ready; no production changes'
          git push
